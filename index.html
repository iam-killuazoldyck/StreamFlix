<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StreamFlix</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

<style>
body {
  margin: 0;
  background: #141414;
  font-family: Arial, sans-serif;
  color: white;
}

header {
  padding: 15px 30px;
  font-size: 26px;
  font-weight: bold;
  color: #e50914;
  background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.input-box {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.input-box input {
  flex: 1;
  padding: 12px;
  background: #333;
  border: none;
  color: white;
  border-radius: 4px;
}

.input-box button {
  background: #e50914;
  border: none;
  padding: 12px 20px;
  color: white;
  cursor: pointer;
  border-radius: 4px;
}

.input-box button:hover {
  background: #f6121d;
}

.player-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: black;
  border-radius: 12px;
  overflow: hidden;
}

/* 🔥 Make Plyr fill the wrapper */
.player-wrapper .plyr {
  position: absolute;
  inset: 0;
}

/* Ensure video fills properly */
.player-wrapper video {
  width: 100%;
  height: 100%;
  object-fit: contain; /* or cover */
}

/* Customize Plyr to look more Netflix-like */
.plyr--video {
  --plyr-color-main: #e50914;
}

.plyr__control--overlaid {
  background: rgba(229,9,20,0.9);
}

.title {
  margin-top: 15px;
  font-size: 20px;
  font-weight: bold;
}

.subtitle {
  font-size: 14px;
  color: #aaa;
}
</style>
</head>

<body>

<header>StreamFlix</header>

<div class="container">

  <div class="input-box">
    <input id="url" placeholder="Paste video URL...">
    <button onclick="loadVideo()">Play</button>
  </div>
  <div class="input-box">
    <input id="subUrl" placeholder="Subtitle URL (.vtt)">
    <input type="file" id="subFile" accept=".vtt,.srt">
    <button onclick="addSubtitle()">Add Subtitles</button>
  </div>
  <div class="player-wrapper">
    <video id="player" controls></video>
  </div>

  <div class="title" id="title">No video loaded</div>
  <div class="subtitle">Netflix-style player with advanced controls</div>

</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>
function addSubtitle() {
  const url = document.getElementById('subUrl').value;
  const file = document.getElementById('subFile').files[0];

  // URL subtitles
  if (url) {
    player.addTrack({
      kind: 'subtitles',
      label: 'External Subtitle',
      srclang: 'en',
      src: url,
      default: true
    }, true);
  }

  // File upload subtitles
  if (file) {
    const fileURL = URL.createObjectURL(file);

    player.addTrack({
      kind: 'subtitles',
      label: file.name,
      srclang: 'en',
      src: fileURL,
      default: true
    }, true);
  }
}
const player = new Plyr('#player', {
  controls: [
    'play-large',
    'rewind',
    'play',
    'fast-forward',
    'progress',
    'current-time',
    'duration',
    'mute',
    'volume',
    'captions',
    'settings',
    'fullscreen'
  ],
  settings: ['speed', 'quality', 'captions'],
  captions: {
    active: true,
    update: true,
    language: 'en'
  }
});

function loadVideo() {
  const url = document.getElementById('url').value;

  if (!url) return;

  player.source = {
    type: 'video',
    sources: [{ src: url, type: 'video/mp4' }],
    // THIS is required for Plyr UI to show captions menu
    tracks: []
  };
  document.getElementById("title").innerText = url.split('/').pop();
}
</script>

</body>
</html>
