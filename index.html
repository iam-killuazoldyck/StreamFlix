<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StreamFlix</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

<style>
body {
  margin: 0;
  background: #141414;
  font-family: Arial, sans-serif;
  color: white;
}

header {
  padding: 15px 30px;
  font-size: 26px;
  font-weight: bold;
  color: #e50914;
  background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.input-box {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.input-box input {
  flex: 1;
  padding: 12px;
  background: #333;
  border: none;
  color: white;
  border-radius: 4px;
}

.input-box button {
  background: #e50914;
  border: none;
  padding: 12px 20px;
  color: white;
  cursor: pointer;
  border-radius: 4px;
}

.input-box button:hover {
  background: #f6121d;
}

.player-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: black;
  border-radius: 12px;
  overflow: hidden;
}

/* 🔥 Make Plyr fill the wrapper */
.player-wrapper .plyr {
  position: absolute;
  inset: 0;
}

/* Ensure video fills properly */
.player-wrapper video {
  width: 100%;
  height: 100%;
  object-fit: contain; /* or cover */
}

/* Customize Plyr to look more Netflix-like */
.plyr--video {
  --plyr-color-main: #e50914;
}

.plyr__control--overlaid {
  background: rgba(229,9,20,0.9);
}

.title {
  margin-top: 15px;
  font-size: 20px;
  font-weight: bold;
}

.subtitle {
  font-size: 14px;
  color: #aaa;
}
</style>
</head>

<body>

<header>StreamFlix</header>

<div class="container">

  <div class="input-box">
    <input id="url" placeholder="Paste video URL...">
    <button onclick="loadVideo()">Play</button>
  </div>
  <div class="input-box">
    <input id="subUrl" placeholder="Subtitle URL (.vtt)">
    <input type="file" id="subFile" accept=".vtt,.srt">
    <button onclick="addSubtitle()">Add Subtitles</button>
  </div>
  <div class="player-wrapper">
    <video id="player" controls></video>
  </div>

  <div class="title" id="title">No video loaded</div>
  <div class="subtitle">Netflix-style player with advanced controls</div>

</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>
const video = document.getElementById('player');

const player = new Plyr(video, {
  controls: [
    'play-large',
    'rewind',
    'play',
    'fast-forward',
    'progress',
    'current-time',
    'duration',
    'mute',
    'volume',
    'captions',
    'settings',
    'fullscreen'
  ],
  settings: ['speed', 'quality', 'captions'],
  captions: {
    active: true,
    update: true,
    language: 'en'
  }
});

// 🔥 Convert SRT → VTT
function srtToVtt(srt) {
  return "WEBVTT\n\n" + srt
    .replace(/\r+/g, '')
    .replace(/(\d+)\n(\d{2}:\d{2}:\d{2}),(\d{3}) --> (\d{2}:\d{2}:\d{2}),(\d{3})/g,
      (_, i, h1, ms1, h2, ms2) => {
        return `${i}\n${h1}.${ms1} --> ${h2}.${ms2}`;
      });
}

// 🔥 Remove existing subtitle tracks
function clearTracks() {
  const tracks = video.querySelectorAll('track');
  tracks.forEach(t => t.remove());
}

// 🔥 Add subtitle
async function addSubtitle() {
  const url = document.getElementById('subUrl').value;
  const file = document.getElementById('subFile').files[0];

  clearTracks();

  let vttBlob;

  // ✅ URL input
  if (url) {
    const res = await fetch(url);
    let text = await res.text();

    if (url.endsWith('.srt')) {
      text = srtToVtt(text);
    }

    vttBlob = new Blob([text], { type: 'text/vtt' });
  }

  // ✅ File upload
  if (file) {
    let text = await file.text();

    if (file.name.endsWith('.srt')) {
      text = srtToVtt(text);
    }

    vttBlob = new Blob([text], { type: 'text/vtt' });
  }

  if (!vttBlob) return;

  const trackURL = URL.createObjectURL(vttBlob);

  const track = document.createElement('track');
  track.kind = 'subtitles';
  track.label = 'Subtitle';
  track.srclang = 'en';
  track.src = trackURL;
  track.default = true;

  video.appendChild(track);

  // 🔥 Important: force Plyr to re-detect tracks
  player.captions.update();
}

// 🔥 Load video
function loadVideo() {
  const url = document.getElementById('url').value;
  if (!url) return;

  clearTracks();

  video.src = url;
  video.type = 'video/mp4'; // browser will still try best guess

  player.source = {
    type: 'video',
    sources: [{ src: url }]
  };

  document.getElementById("title").innerText = url.split('/').pop();
}
</script>

</body>
</html>
